groups:
  - name: ecs_alerts
    rules:
      - alert: HighCPU
        expr: ecs_cpu_utilization > 80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High CPU usage on ECS Task {{ $labels.task_id }}"
          description: "CPU usage is above 80% for more than 5 minutes."

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring target down"
          description: "Target {{ $labels.instance }} is unreachable."

      - alert: ECSTaskUnreachable
        expr: absent(up{job="application-containers"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ECS Task not reachable"
          description: "No application containers are being scraped."
